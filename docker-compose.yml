services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: suraksha
      POSTGRES_USER: suraksha
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-suraksha}
    volumes:
      - suraksha-db:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U suraksha -d suraksha"]
      interval: 5s
      timeout: 3s
      retries: 20

  turn:
    image: coturn/coturn:4.6-alpine
    command:
      - -n
      - --log-file=stdout
      - --lt-cred-mech
      - --fingerprint
      - --realm=suraksha
      - --user=${TURN_USERNAME:-suraksha}:${TURN_CREDENTIAL:-change-me-turn}
      - --min-port=49160
      - --max-port=49200
      - --no-cli
    ports:
      - "3478:3478/tcp"
      - "3478:3478/udp"
      - "49160-49200:49160-49200/udp"

  api:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 4000
      DATABASE_URL: postgres://suraksha:${POSTGRES_PASSWORD:-suraksha}@db:5432/suraksha
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env}
      DEMO_MODE: ${DEMO_MODE:-0}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-http://localhost:4000}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:4000}
      TURN_URLS: ${TURN_URLS:-}
      TURN_USERNAME: ${TURN_USERNAME:-}
      TURN_CREDENTIAL: ${TURN_CREDENTIAL:-}
    ports:
      - "4000:4000"
    restart: unless-stopped

volumes:
  suraksha-db:
